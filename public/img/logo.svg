<!-- app/icon.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a34a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="100" height="100" rx="20" fill="url(#bg)"/>
  
  <!-- 网格线 -->
  <line x1="20" y1="80" x2="85" y2="80" stroke="#334155" stroke-width="0.5" stroke-dasharray="2,2"/>
  <line x1="20" y1="60" x2="85" y2="60" stroke="#334155" stroke-width="0.5" stroke-dasharray="2,2"/>
  <line x1="20" y1="40" x2="85" y2="40" stroke="#334155" stroke-width="0.5" stroke-dasharray="2,2"/>
  <line x1="20" y1="20" x2="85" y2="20" stroke="#334155" stroke-width="0.5" stroke-dasharray="2,2"/>
  
  <!-- 股票走势线 -->
  <polyline 
    points="20,75 35,65 45,68 55,50 65,55 75,30 85,15" 
    fill="none" 
    stroke="url(#line)" 
    stroke-width="3.5" 
    stroke-linecap="round" 
    stroke-linejoin="round"
  />
  
  <!-- 数据点 -->
  <circle cx="20" cy="75" r="2.5" fill="#22c55e"/>
  <circle cx="35" cy="65" r="2.5" fill="#22c55e"/>
  <circle cx="45" cy="68" r="2.5" fill="#22c55e"/>
  <circle cx="55" cy="50" r="2.5" fill="#22c55e"/>
  <circle cx="65" cy="55" r="2.5" fill="#22c55e"/>
  <circle cx="75" cy="30" r="2.5" fill="#22c55e"/>
  <circle cx="85" cy="15" r="3.5" fill="#22c55e" stroke="#1a1a2e" stroke-width="1.5"/>
  
  <!-- 上涨箭头 -->
  <polygon 
    points="75,12 82,8 83,20" 
    fill="#22c55e" 
    stroke="#1a1a2e" 
    stroke-width="1"
  />
</svg>